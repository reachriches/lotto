## jpa
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

## logging
logging.level.org.hibernate.sql=debug
logging.level.org.hibernate.type.descriptor.sql.spi=trace

## Lotto Filter Configuration
# AC Value Filter
lotto.filter.ac.enabled=true
lotto.filter.ac.min=7
lotto.filter.ac.max=10
lotto.filter.ac.priority=1

# Delta System Filter
lotto.filter.delta.enabled=true
lotto.filter.delta.priority=2

# Prime Balance Filter
lotto.filter.prime.enabled=true
lotto.filter.prime.min=2
lotto.filter.prime.max=3
lotto.filter.prime.priority=3

# Sum Distribution Filter
lotto.filter.sum.enabled=true
lotto.filter.sum.mean=138
lotto.filter.sum.stddev=30
lotto.filter.sum.priority=4

# Position Analysis Filter
lotto.filter.position.enabled=true
lotto.filter.position.priority=5

# Pattern Exclusion Filter
lotto.filter.pattern.enabled=true
lotto.filter.pattern.priority=6

# Recent History Filter
lotto.filter.history.enabled=true
lotto.filter.history.priority=7
lotto.filter.history.recent-rounds=5